[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-brain"
version = "0.2.0"
description = "Knowledge Brain - 个人知识大脑系统，采集、处理、查询与可视化"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Knowledge Brain Team"}]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "PyPDF2>=3.0.0",
    "dashscope>=1.14.0",
    "openai>=1.0.0",
    "litellm>=1.30.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "chromadb>=0.4.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.5",
    "schedule>=1.2.0",
    "croniter>=1.4.0",
    "pypinyin>=0.49",
    "oss2>=2.18.0",
]

[project.scripts]
kbrain = "kb.cli:cli"

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.setuptools.package-data]
kb = ["config-template.yaml", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
