    <div class="spinner"></div>
    <p style="margin-top:8px">加载 Knowledge Brain...</p>
    <p style="font-size:12px;color:#9ca3af;margin-top:4px" id="load-status">正在加载核心库...</p>
  </div>
</div>
<script>
var libsLoaded=0,libNames=['React','ReactDOM','Babel','antd','G6','echarts'];
function checkLib(n){libsLoaded++;var el=document.getElementById('load-status');if(el)el.textContent='已加载 '+libsLoaded+'/6: '+n;}
</script>
<script onload="checkLib('React')" onerror="document.getElementById('load-status').textContent='CDN加载失败，请检查网络'" src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script onload="checkLib('ReactDOM')" src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script onload="checkLib('Babel')" src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js" crossorigin></script>
<script onload="checkLib('antd')" src="https://unpkg.com/antd@5.15.0/dist/antd.min.js" crossorigin></script>
<script onload="checkLib('G6')" src="https://unpkg.com/@antv/g6@4.8.24/dist/g6.min.js" crossorigin></script>
<script onload="checkLib('echarts')" src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = '/api';

async function apiFetch(path, opts = {}) {
  try {
    const res = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.detail || err.error || 'HTTP ' + res.status);
    }
    return await res.json();
  } catch (e) {
    console.error('API Error:', path, e);
    return null;
  }
}

const typeIcons = {file:'📄',webpage:'🌐',bookmark:'🔖',note:'📝',paper:'📰',email:'📧'};
const typeLabels = {file:'文件',webpage:'网页',bookmark:'书签',note:'笔记',paper:'论文',email:'邮件'};
const typeBadgeClass = {file:'badge-blue',webpage:'badge-green',bookmark:'badge-orange',note:'badge-purple',paper:'badge-pink',email:'badge-gray'};

// ========== Dashboard ==========
function DashboardPage({ onNavigate }) {
  const [stats, setStats] = useState(null);
  const [timeline, setTimeline] = useState([]);
  const [tags, setTags] = useState([]);
  const [recents, setRecents] = useState([]);
  const pieRef = useRef(null);
  const lineRef = useRef(null);

  useEffect(() => {
    apiFetch('/stats').then(d => d && setStats(d));
    apiFetch('/timeline?days=30').then(d => d && setTimeline(d));
    apiFetch('/tags').then(d => d && setTags(d));
    apiFetch('/recent?limit=5').then(d => d && setRecents(d));
  }, []);

  useEffect(() => {
    if (!stats || !pieRef.current) return;
    const chart = echarts.init(pieRef.current);
    const byType = stats.by_type || {};
    chart.setOption({
      tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
      color: ['#4f46e5','#7c3aed','#ec4899','#06b6d4','#10b981','#f59e0b'],
      series: [{ type: 'pie', radius: ['45%','72%'], data: Object.entries(byType).map(([k,v])=>({name:typeLabels[k]||k,value:v})),
        label: {formatter:'{b}\n{c}篇',fontSize:12}, itemStyle: {borderRadius:6,borderColor:'#fff',borderWidth:2} }]
    });
    const onResize = () => chart.resize();
    window.addEventListener('resize', onResize);
    return () => { window.removeEventListener('resize', onResize); chart.dispose(); };
  }, [stats]);

  useEffect(() => {
    if (!timeline.length || !lineRef.current) return;
    const chart = echarts.init(lineRef.current);
    chart.setOption({
      tooltip: { trigger: 'axis' },
      xAxis: { type: 'category', data: timeline.map(t=>t.date), axisLabel: {rotate:45,fontSize:10,color:'#6b7280'}, axisLine:{lineStyle:{color:'#e5e7eb'}} },
      yAxis: { type: 'value', minInterval: 1, axisLabel:{color:'#6b7280'}, splitLine:{lineStyle:{color:'#f3f4f6'}} },
      series: [{ type: 'line', data: timeline.map(t=>t.count), smooth: true,
        areaStyle: {color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(124,58,237,.25)'},{offset:1,color:'rgba(124,58,237,.02)'}]}},

function TagEditor({value=[],onChange}) {

}
function RecordTags({item,onSaved,onFilter,selectedTags=[]}) {
  const [input,setInput]=useState(''), [adding,setAdding]=useState(false), [busy,setBusy]=useState(false), [error,setError]=useState('');
  const save=async tags=>{
    if(busy)return;setBusy(true);setError('');
    try{
      const response=await fetch('/api/items/'+encodeURIComponent(item.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({tags,revision:item.revision||0})});
      const data=await response.json();
      if(!response.ok)throw new Error(response.status===409?'此记录已更新，请刷新后重试。':typeof data.detail==='string'?data.detail:'标签保存失败');
      onSaved(item.id,tags,data.revision);setInput('');setAdding(false);
    }catch(e){setError(e.message);}finally{setBusy(false);}
  };
  const add=()=>{const tags=input.split(/[,，\n]/).map(t=>t.trim()).filter(Boolean);if(tags.length)save([...new Set([...(item.tags||[]),...tags])]);};
  return <div className="record-tags" aria-label={'管理标签 '+(item.title||'未命名知识')}>

    {adding&&<div className="flex gap-8 mt-8"><input className="input" autoFocus aria-label="为此记录新增标签" placeholder="标签名称，逗号分隔多个" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();add();}if(e.key==='Escape')setAdding(false);}} disabled={busy}/><button type="button" className="btn btn-sm" disabled={busy||!input.trim()} onClick={add}>添加并保存</button></div>}{error&&<p role="alert" className="text-sm" style={{color:'#b91c1c',marginTop:8}}>{error}</p>}
  </div>;
}
function ReadingText({content}) {
  const linkify=text=>text.split(/(https?:\/\/[^\s<>]+)/g).map((part,i)=>/^https?:\/\//.test(part)?<a key={i} href={part} target="_blank" rel="noopener noreferrer">{part}</a>:part);
  const inline=text=>text.split(/(\*\*[^*]+\*\*)/g).map((part,i)=>part.startsWith('**')&&part.endsWith('**')?<strong key={i}>{linkify(part.slice(2,-2))}</strong>:<React.Fragment key={i}>{linkify(part)}</React.Fragment>);
  return <div className="reader-prose">{(content||'此条目尚无可阅读的正文。').split(/\n\s*\n/).map((paragraph,i)=>/^#{1,3} /.test(paragraph)?<h3 key={i} style={{margin:'24px 0 12px',fontSize:19}}>{inline(paragraph.replace(/^#{1,3} /,''))}</h3>:<p key={i} style={{marginBottom:18}}>{inline(paragraph.replace(/^- /,'• '))}</p>)}</div>;
}

function GraphPage({onNavigate}) {
  const [mode,setMode]=useState('documents'), [job,setJob]=useState(null);
  const containerRef = useRef(null);
  const graphRef = useRef(null);
  const [loading, setLoading] = useState(true);
  const [selectedEntity, setSelectedEntity] = useState(null);
  const [filter, setFilter] = useState('all');
  const [stats, setStats] = useState(null);
  const entityTypes = ['all','person','concept','tool','project','organization'];
  const typeColors = {person:'#ef4444',concept:'#4f46e5',tool:'#10b981',project:'#7c3aed',organization:'#f59e0b'};
  const typeIconsG = {person:'👤',concept:'💡',tool:'🔧',project:'📋',organization:'🏢'};
  const typeLabelsG = {person:'人物',concept:'概念',tool:'工具',project:'项目',organization:'组织'};

  const loadGraph = useCallback((entityType) => {
    setLoading(true);
    const url = mode==='documents'?'/graph/documents?limit=200':entityType && entityType!=='all' ? '/graph?entity_type='+entityType+'&limit=200' : '/graph?limit=200';
    apiFetch(url).then(data => { if (data) { renderGraph(data); setStats(data.stats); } setLoading(false); });
  }, [mode]);
  useEffect(() => { loadGraph('all'); return()=>{if(graphRef.current){graphRef.current.destroy();graphRef.current=null;}}; }, [loadGraph]);
  useEffect(()=>{if(job?.state!=='running')return;const timer=setInterval(()=>apiFetch('/mine/entities/status').then(d=>{if(d){setJob(d);if(d.state!=='running')loadGraph(filter);}}),1500);return()=>clearInterval(timer);},[job?.state,loadGraph,filter]);

  function renderGraph(data) {
    if (!containerRef.current) return;
    if (graphRef.current) { try{graphRef.current.destroy();}catch(e){} }
    const nodes = data.nodes.map(n => ({
      id: String(n.id), label: (typeIconsG[n.type]||'')+' '+(n.display_name||n.name),
      size: Math.max(28, Math.min(70, 18+(n.mention_count||1)*7)),
      style: { fill: typeColors[n.type]||'#4f46e5', stroke: '#fff', lineWidth: 2 },
      labelCfg: { style: { fill: '#374151', fontSize: 11 }, position: 'bottom' }, entityData: n
    }));
    const edges = data.edges.map(e => ({
      source: String(e.source_entity_id), target: String(e.target_entity_id), label: e.relation_type,
      style: { stroke: '#d1d5db', lineWidth: 1.2, endArrow: true }, labelCfg: { style: { fill: '#9ca3af', fontSize: 9 }, autoRotate: true }
    }));
    const graph = new G6.Graph({
      container: containerRef.current, width: containerRef.current.offsetWidth, height: 620,

function SearchPage() {

  const [loading, setLoading] = useState(false);
  const [mode, setMode] = useState('rag');
  const [query, setQuery] = useState('');
  const [sessionId, setSessionId] = useState(null);

  const handleSearch = async () => {
    if (!query.trim()) return;
    setLoading(true); setAnswer(''); setResults([]);
    try {
      if (mode === 'rag' || mode === 'pipeline') {
        const ep = mode === 'rag' ? '/search/rag' : '/search/pipeline';
        const d = await apiFetch(ep, {method:'POST',body:JSON.stringify({query,top_k:8,session_id:sessionId})});
        if (d) { setAnswer(d.answer||''); setResults(d.sources||[]); if(d.session_id) setSessionId(d.session_id); }
      } else if (mode === 'semantic') {
        const d = await apiFetch('/search/semantic', {method:'POST',body:JSON.stringify({query,top_k:10})});
        if (d) setResults(d);
      } else {
        const d = await apiFetch('/search/keyword?q='+encodeURIComponent(query)+'&limit=20');
        if (d) setResults(d);
      }
    } catch(e) { alert('搜索失败: '+e.message); }

  return (
    <div>
      <div className="page-title">🔍 智能搜索</div>
      <div className="search-container">
        <div className="tabs">
          {[{k:'rag',l:'🤖 RAG问答'},{k:'pipeline',l:'⚡ 增强管道'},{k:'semantic',l:'🔍 语义搜索'},{k:'keyword',l:'📝 关键词'}].map(t=>(

          ))}
        </div>

          <input className="input" placeholder={mode==='rag'||mode==='pipeline'?'输入您的问题...':'输入搜索关键词...'} value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSearch()} />
          {(mode==='rag'||mode==='pipeline') && sessionId && <button className="btn btn-sm" onClick={()=>{setSessionId(null);setAnswer('');setResults([]);}} title="新会话">🔄</button>}
          <button className="btn btn-primary" onClick={handleSearch} disabled={loading}>{loading?'搜索中...':'搜索'}</button>
        </div>
      </div>
      {answer && <div className="answer-box"><h3>🤖 AI 回答</h3><div className="answer-content">{answer}</div></div>}
      <div style={{maxWidth:720,margin:'0 auto'}}>
        {results.map((r,i)=>(
          <div className="result-item" key={i}>

              <h4>{typeIcons[r.metadata?.content_type]||''} {r.metadata?.title || r.id?.slice(0,8) || ('结果 '+(i+1))}</h4>
              {r.score!=null && <span className="score-badge">{typeof r.score==='number'?r.score.toFixed(3):r.score}</span>}

            <p className="text-secondary text-sm mt-8" style={{lineHeight:1.6}}>{(r.content||'').slice(0,300)}{(r.content||'').length>300?'...':''}</p>
          </div>
        ))}
      </div>
      {!loading && !answer && results.length===0 && <div className="empty"><div className="empty-icon">🔍</div>输入问题或关键词搜索知识库</div>}
    </div>
  );
}

async function captureFetch(path, options) {
  try {
    return await fetch(path, options);
  } catch (error) {
    if (error instanceof TypeError) {
      throw new Error('无法连接知识库服务（' + window.location.origin + '）。请确认终端中的 kbrain web 正在运行，且端口与当前页面一致。表单内容已保留；恢复连接后可重新保存。若请求途中断开，请先检查知识库是否已保存该记录。');
    }
    throw error;
  }
}

  const [backups, setBackups] = useState([]);
  const [loading, setLoading] = useState(false);
  const loadBackups = () => { apiFetch('/backup/list').then(d=>d&&setBackups(d)); };
  useEffect(loadBackups, []);
  const createBackup = async () => {
    setLoading(true); const r = await apiFetch('/backup/create', {method:'POST'});
    if (r) alert('✅ 备份创建成功'); loadBackups(); setLoading(false);
  };
  const deleteBackup = async (name) => { if(!confirm('删除备份 '+name+'?'))return; await apiFetch('/backup/'+encodeURIComponent(name),{method:'DELETE'}); loadBackups(); };
  const fmtSize = (b) => { if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(2)+' MB'; };

  return (
    <div style={{maxWidth:700,margin:'0 auto'}}>
      <div className="page-title">💾 备份管理</div>
      <div className="flex flex-between items-center mb-16">
        <p className="text-secondary">备份包含数据库、向量索引和采集文件</p>
        <button className="btn btn-primary" onClick={createBackup} disabled={loading}>{loading?'备份中...':'➕ 创建备份'}</button>
      </div>
      <div className="chart-box">
        {backups.map((b,i)=>(
          <div key={i} style={{padding:'14px 0',borderBottom:i<backups.length-1?'1px solid #f3f4f6':'none'}} className="flex flex-between items-center">
            <div><div style={{fontWeight:500}}>📦 {b.name}</div><div className="text-xs text-secondary mt-4">{b.created?.slice(0,19).replace('T',' ')}</div></div>
            <div className="flex gap-8 items-center">
              <span className="badge badge-green">{fmtSize(b.size)}</span>
              <a href={"/api/backup/download/"+encodeURIComponent(b.name)} className="btn btn-sm" download>⬇️</a>
              <button className="btn btn-danger btn-sm" onClick={()=>deleteBackup(b.name)}>🗑️</button>
            </div>
          </div>
        ))}
        {backups.length===0 && <div className="empty"><div className="empty-icon">💾</div>暂无备份</div>}
      </div>
    </div>
  );
}

// ========== Settings ==========
function SettingsPage() {
  const [config, setConfig] = useState(null);
  const [services, setServices] = useState({});
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({emb_api:'',llm_api:'',llm_provider:'dashscope',emb_provider:'dashscope',backup_enabled:false});
  useEffect(() => {
    apiFetch('/settings').then(d => { if(d) { setConfig(d); setForm(f=>({...f,llm_provider:d.llm?.provider||'dashscope',emb_provider:d.embedding?.provider||'dashscope',backup_enabled:d.backup?.enabled||false})); }});
    apiFetch('/settings/services').then(d => d && setServices(d));
  }, []);
  const save = async () => {
    setSaving(true);
    const body = {};
    if (form.emb_api) body.embedding_api_key = form.emb_api;
    if (form.llm_api) body.llm_api_key = form.llm_api;
    body.llm_provider = form.llm_provider;
    body.embedding_provider = form.emb_provider;
    body.backup_enabled = form.backup_enabled;
    const r = await apiFetch('/settings', {method:'POST',body:JSON.stringify(body)});
    setSaving(false);
    if (r?.success) { alert('✅ 设置已保存'); apiFetch('/settings/services').then(d=>d&&setServices(d)); }
  };

  return (
    <div style={{maxWidth:640,margin:'0 auto'}}>
      <div className="page-title">⚙️ 设置</div>
      <div className="chart-box mb-24">
        <h3>🔌 服务状态</h3>
        <div className="setting-row"><span>向量嵌入服务</span><span><span className={"status-dot "+(services.embedding_available?"status-ok":"status-err")}></span>{services.embedding_available?'已配置':'未配置'}</span></div>
        <div className="setting-row"><span>LLM 问答服务</span><span><span className={"status-dot "+(services.llm_available?"status-ok":"status-err")}></span>{services.llm_available?'已配置':'未配置'}</span></div>
      </div>
      <div className="chart-box mb-24">
        <h3>🔑 API 密钥配置</h3>
        <p className="text-sm text-secondary mb-16">密钥保存在本地配置文件中</p>
        <div style={{marginBottom:14}}><label className="text-sm text-bold" style={{display:'block',marginBottom:6}}>嵌入服务</label>
          <select className="input" value={form.emb_provider} onChange={e=>setForm({...form,emb_provider:e.target.value})}>
            <option value="dashscope">DashScope（通义千问）</option><option value="openai">OpenAI</option><option value="openai_compatible">OpenAI兼容</option>
          </select></div>
        <div style={{marginBottom:14}}><label className="text-sm text-bold" style={{display:'block',marginBottom:6}}>嵌入 API Key{config?.embedding?.api_key==='***'?'（已配置）':''}</label>
          <input className="input" type="password" placeholder="sk-..." value={form.emb_api} onChange={e=>setForm({...form,emb_api:e.target.value})} /></div>
        <div style={{marginBottom:14}}><label className="text-sm text-bold" style={{display:'block',marginBottom:6}}>LLM 服务</label>
          <select className="input" value={form.llm_provider} onChange={e=>setForm({...form,llm_provider:e.target.value})}>
            <option value="dashscope">DashScope（通义千问）</option><option value="openai">OpenAI</option><option value="openai_compatible">OpenAI兼容</option>
          </select></div>
        <div style={{marginBottom:14}}><label className="text-sm text-bold" style={{display:'block',marginBottom:6}}>LLM API Key{config?.llm?.api_key==='***'?'（已配置）':''}</label>
          <input className="input" type="password" placeholder="sk-..." value={form.llm_api} onChange={e=>setForm({...form,llm_api:e.target.value})} /></div>
        <div className="setting-row"><label>启用每日自动备份</label><input type="checkbox" checked={form.backup_enabled} onChange={e=>setForm({...form,backup_enabled:e.target.checked})} style={{width:18,height:18}} /></div>
        <button className="btn btn-primary mt-24" onClick={save} disabled={saving} style={{width:'100%'}}>{saving?'保存中...':'💾 保存设置'}</button>
      </div>
      <div className="chart-box">
        <h3>ℹ️ 关于</h3>
        <div className="text-sm" style={{lineHeight:2,color:'#6b7280'}}>
          <div><strong>Knowledge Brain</strong> v0.2.0</div>
          <div>数据目录: {config?.data_dir || '~/.knowledge-brain'}</div>
        </div>
      </div>
    </div>
  );
}

// ========== Timeline ==========
function TimelinePage() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => { apiFetch('/items?limit=100').then(d => { if(d) setItems(d); setLoading(false); }); }, []);
  if (loading) return <div className="empty"><div className="empty-icon">⏳</div>加载中...</div>;
  return (
    <div style={{maxWidth:700,margin:'0 auto'}}>
      <div className="page-title">📅 时间线</div>
      {items.length===0 && <div className="empty"><div className="empty-icon">📭</div>暂无知识</div>}
      {items.map(item=>(
        <div className="timeline-item" key={item.id}>
          <div className="flex flex-between items-center">
            <strong style={{fontSize:15}}>{typeIcons[item.content_type]||'📄'} {item.title||item.id?.slice(0,8)}</strong>
            <span className="text-secondary text-sm">{item.collected_at?.slice(0,10)}</span>
          </div>
          {item.summary && <p className="text-secondary text-sm mt-8" style={{lineHeight:1.6}}>{item.summary.slice(0,200)}{item.summary.length>200?'...':''}</p>}
          <span className={"badge "+(typeBadgeClass[item.content_type]||'badge-gray')} style={{marginTop:8,display:'inline-block'}}>{typeLabels[item.content_type]||item.content_type}</span>
        </div>
      ))}
    </div>
  );
}

// ========== Main App ==========
function App() {
  const [page, setPage] = useState('dashboard');
  const [pageProps, setPageProps] = useState({});
  const [services, setServices] = useState({});
  useEffect(() => { apiFetch('/settings/services').then(d=>d&&setServices(d)); }, []);
  const navigate = (p, props = {}) => { setPage(p); setPageProps(props); };
  const menuItems = [
    {key:'dashboard',icon:'📊',label:'仪表盘',group:'概览'},
    {key:'search',icon:'🔍',label:'搜索',group:'概览'},
    {key:'add',icon:'➕',label:'添加知识',group:'知识'},
    {key:'items',icon:'📚',label:'知识库',group:'知识'},
    {key:'timeline',icon:'📅',label:'时间线',group:'知识'},
    {key:'graph',icon:'🕸️',label:'知识图谱',group:'分析'},
    {key:'topics',icon:'📂',label:'主题地图',group:'分析'},
    {key:'wiki',icon:'📖',label:'百科',group:'分析'},
    {key:'backup',icon:'💾',label:'备份',group:'系统'},
    {key:'settings',icon:'⚙️',label:'设置',group:'系统'},
  ];
  const pages = {dashboard:DashboardPage,search:SearchPage,add:AddPage,items:ItemsPage,graph:GraphPage,topics:TopicsPage,wiki:WikiPage,timeline:TimelinePage,backup:BackupPage,settings:SettingsPage};
  const CurrentPage = pages[page] || DashboardPage;
  const groups = [...new Set(menuItems.map(m=>m.group))];

  return (
    <div>
      <div className="app-header">
        <div className="brand"><h1>🧠 Knowledge Brain</h1><span className="badge-ver">阅读工作台</span></div>
        <div className="text-xs" style={{opacity:.85}}>
          {services.embedding_available ? '🟢' : '🔴'} 嵌入 {services.llm_available ? '🟢' : '🔴'} LLM
        </div>
      </div>
      <div className="main-layout">
        <div className="sidebar">
          {groups.map(g => (
            <div key={g}>
              <div className="section-label">{g}</div>
              {menuItems.filter(m=>m.group===g).map(item=>(
                <div key={item.key} className={'menu-item'+(page===item.key?' active':'')} onClick={()=>navigate(item.key)}>
                  <span className="menu-icon">{item.icon}</span> {item.label}
                </div>
              ))}
            </div>
          ))}
        </div>
        <div className="content"><CurrentPage {...pageProps} onNavigate={navigate} /></div>
      </div>
    </div>
  );
}

document.getElementById('root').innerHTML = '<div id="app-root"></div>';
const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);
</script>
</body>
</html>
